name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: |
          cd backend
          python -m pytest -q
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check design source paths
        run: scripts/check-design-source.sh
        env:
          BAI_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BAI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: |
          cd apps/web
          npm ci
      - name: Typecheck
        run: |
          cd apps/web
          npm run typecheck
      - name: Run unit tests
        run: |
          cd apps/web
          npm test
      - name: Verify PR governance policy
        run: |
          node --test \
            scripts/tests/pr-automerge-policy.test.mjs \
            scripts/tests/pr-governance-policy.test.mjs
          node scripts/pr-governance-harness.mjs fixtures
      - name: Classify pull request diff
        if: github.event_name == 'pull_request'
        run: |
          node scripts/pr-governance-harness.mjs verify-diff \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --author "${{ github.event.pull_request.user.login }}" \
            --permission read \
            --association "${{ github.event.pull_request.author_association }}"
      - name: Verify talent office authority and point invariants
        run: |
          cd apps/web
          npm run harness:talent-office
      - name: Verify Park PR design reaches Next
        run: |
          cd apps/web
          npm run design:park
      - name: Build
        run: |
          cd apps/web
          npm run build
