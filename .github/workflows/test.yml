name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: |
          cd backend
          python -m pytest -q
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check design source paths
        run: scripts/check-design-source.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: |
          cd apps/web
          npm ci
      - name: Typecheck
        run: |
          cd apps/web
          npm run typecheck
      - name: Run unit tests
        run: |
          cd apps/web
          npm test
      - name: Verify Park PR design reaches Next
        run: |
          cd apps/web
          npm run design:park
      - name: Build
        run: |
          cd apps/web
          npm run build
