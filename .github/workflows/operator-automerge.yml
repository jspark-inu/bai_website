name: trusted PR auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    # Registered students and trusted operators do not need a separate approval
    # for ordinary PRs. Required CI checks still run, and CODEOWNERS adds PI
    # approval only for security, data, API, dependency, deployment, or
    # site-entrypoint changes.
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy from main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Enable squash auto-merge for trusted contributor
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: author,
            });

            const registryPath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'trusted-students.json');
            const registry = JSON.parse(fs.readFileSync(registryPath, 'utf8'));
            const policyUrl = pathToFileURL(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'pr-automerge-policy.mjs'),
            ).href;
            const { evaluateAutoMergeAuthor } = await import(policyUrl);
            const decision = evaluateAutoMergeAuthor({
              author,
              permission: permission.permission,
              association: pr.author_association,
              trustedStudents: registry.students,
            });

            if (!decision.allowed) {
              core.notice(`${author} is not eligible for auto-merge: ${decision.reason}`);
              return;
            }

            const result = await github.graphql(
              `mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) { pullRequest { number autoMergeRequest { enabledAt } } }
              }`,
              { pullRequestId: pr.node_id },
            );
            const enabledAt = result.enablePullRequestAutoMerge.pullRequest.autoMergeRequest.enabledAt;
            core.notice(`Auto-merge armed for ${decision.kind} ${author} on PR #${pr.number} at ${enabledAt}.`);
