name: trusted PR auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  enable-auto-merge:
    # Trusted collaborators do not need a separate approval for ordinary PRs.
    # Required CI checks still run, and CODEOWNERS adds PI approval only for
    # authentication, data, deployment, or site-entrypoint changes.
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge for trusted contributor
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: author,
            });
            const allowed = new Set(['admin', 'maintain', 'write']);
            if (!allowed.has(permission.user.permissions)) {
              core.notice(`${author} is not a trusted operator contributor.`);
              return;
            }
            await github.graphql(
              `mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) { pullRequest { number autoMergeRequest { enabledAt } } }
              }`,
              { pullRequestId: pr.node_id },
            );
            core.notice(`Auto-merge armed for trusted contributor ${author} on PR #${pr.number}.`);
