name: operator-approved auto-merge

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  enable-auto-merge:
    # Any repository collaborator can act as an operator reviewer. GitHub
    # branch rules still require CI, and CODEOWNERS adds PI approval only for
    # authentication, data, deployment, or site-entrypoint changes.
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge after operator approval
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const reviewer = context.payload.review.user.login;
            if (pr.draft) {
              core.notice('Draft PRs are never auto-merged.');
              return;
            }
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: reviewer,
            });
            const allowed = new Set(['admin', 'maintain', 'write']);
            if (!allowed.has(permission.user.permissions)) {
              core.notice(`${reviewer} is not an operator reviewer.`);
              return;
            }
            await github.graphql(
              `mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) { pullRequest { number autoMergeRequest { enabledAt } } }
              }`,
              { pullRequestId: pr.node_id },
            );
            core.notice(`Auto-merge armed by operator ${reviewer} for PR #${pr.number}.`);
